spring:
  application:
    name: ae2-web-management-backend
  datasource:
    url: jdbc:h2:file:./data/ae2web
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

# Sa-Token 账号会话：Cookie 名固定 satoken，同源前端自动携带；超时 7 天
sa-token:
  token-name: satoken
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-read-cookie: true
  is-read-head: true
  token-style: uuid
  is-log: false

app:
  mod:
    # 模组本地 API 地址，只应绑定本机回环地址
    base-url: http://127.0.0.1:8090
    # TODO 与模组配置文件保持一致，部署时务必替换为随机密钥
    shared-secret: change-me
  cors:
    # 前端开发服务器地址，前端框架确定后按需调整
    allowed-origins:
      - http://localhost:5173
  auth:
    # 是否在后端强制登录校验（/api/** 除登录端点）；仅测试切片需要关闭
    # 账号只能在游戏内接入方块 GUI 注册，由账号同步服务（GET /accounts）入库，无引导建号
    enabled: true